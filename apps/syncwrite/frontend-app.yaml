apiVersion: argoproj.io/v1alpha1   
kind: Application                 
metadata:
  name: syncwrite-frontend           
  namespace: argocd     
spec:
  project: default   
  source:
    repoURL: https://github.com/Tanmay-008/k3s-cluster.git
    targetRevision: main
    path: projects/syncwrite/frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc 
    namespace: syncwrite             
  syncPolicy:                      
    automated:                     
      prune: true                  
      selfHeal: true  
    syncOptions: 
      - ApplyOutOfSyncOnly=true 
      - CreateNamespace=true