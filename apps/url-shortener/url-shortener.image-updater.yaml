apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: url-shortener-master-updater
  namespace: argocd 
spec:
  writeBackConfig:
    method: "git:secret:argocd/git-creds"
    gitConfig:
      branch: "main"
      writeBackTarget: "helmvalues:values.yaml"

  applicationRefs:
    
    - namePattern: "url-shortener-frontend"
      images:
        - alias: "frontend"
          imageName: "tanmay678/url-shortener-frontend"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^1\\.0\\.[0-9]+$"
          manifestTargets:
            helm:
              tag: "k3s-apps-chart.image.tag"
    - namePattern: "url-shortener-backend"
      images:
        - alias: "backend"
          imageName: "tanmay678/url-shortener-backend"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^1\\.0\\.[0-9]+$"
          manifestTargets:
            helm:
              tag: "k3s-apps-chart.image.tag"